apiVersion: v1
kind: ConfigMap
metadata:
  name: task-management-config
  namespace: task-management
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"
  GRPC_PORT: "50051"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USER: "root"
  DB_NAME: "task_management_api"
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  REDIS_APP_NAME: "task-management-api"
  SESSION_EXPIRATION: "30m"
  CACHE_EXPIRATION: "10m"
  APP_ENV: "production"
  LOG_LEVEL: "info"
